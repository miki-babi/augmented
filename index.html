<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR GLB Hit Test</title>
    <!-- Include A-Frame and AR.js -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.rawgit.com/jeromeetienne/AR.js/2.1.7/aframe/build/aframe-ar.min.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
    <a-scene
        embedded
        arjs="sourceType: webcam;">
        <!-- Use the hit test system -->
        <a-entity id="cursor" cursor="rayOrigin: mouse"></a-entity>
        <a-entity id="model" position="0 0 0" scale="0.1 0.1 0.1" visible="false" gltf-model="3d.glb"></a-entity>
        <a-camera position="0 0 0" look-controls-enabled="true"></a-camera>
    </a-scene>
</body>
</html>
