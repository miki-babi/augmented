<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Hit Test</title>
    <!-- Include A-Frame and AR.js -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/jeromeetienne/ar.js/aframe/build/aframe-ar.min.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
    <a-scene
        vr-mode-ui="enabled: false;"
        arjs="sourceType: webcam; debugUIEnabled: false;">
        <!-- Cube to place -->
        <a-box 
            id="cube" 
            position="0 0 -5" 
            rotation="0 45 0" 
            color="#4CC3D9" 
            scale="0.5 0.5 0.5" 
            visible="false">
        </a-box>

        <!-- AR Hit Test for placement -->
        <a-entity 
            id="hit-test" 
            geometry="primitive: ring; radiusInner: 0.05; radiusOuter: 0.1"
            material="color: yellow; shader: flat;" 
            position="0 0 -2" 
            visible="false">
        </a-entity>

        <a-camera position="0 1.6 0" look-controls></a-camera>
    </a-scene>

    <script>
        // Wait for the scene to load
        document.querySelector('a-scene').addEventListener('loaded', () => {
            const hitTestEntity = document.getElementById('hit-test');
            const cubeEntity = document.getElementById('cube');

            // Make the hit-test entity visible when clicking on the screen
            window.addEventListener('click', (event) => {
                if (hitTestEntity.getAttribute('visible')) {
                    const position = hitTestEntity.getAttribute('position');
                    cubeEntity.setAttribute('position', position);
                    cubeEntity.setAttribute('visible', true);
                }
            });

            // Update hit-test position and visibility
            document.addEventListener('touchstart', (event) => {
                // Simulate hit-test success for simplicity
                hitTestEntity.setAttribute('position', '0 0 -2'); // Update this logic for real hit testing
                hitTestEntity.setAttribute('visible', true);
            });
        });
    </script>
</body>
</html>
