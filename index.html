<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebXR AR Hit Test</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.153.0/build/three.module.js';
        import { ARButton } from 'https://cdn.jsdelivr.net/npm/three@0.153.0/examples/jsm/webxr/ARButton.js';

        // Scene setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera();
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Add AR button
        try {
            document.body.appendChild(
                ARButton.createButton(renderer, { requiredFeatures: ['hit-test'] })
            );
        } catch (error) {
            alert(`AR button creation failed: ${error.message}`);
        }

        // Lighting
        const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
        light.position.set(0.5, 1, 0.25);
        scene.add(light);

        // Cube model
        const cubeGeometry = new THREE.BoxGeometry(0.1, 0.1, 0.1);
        const cubeMaterial = new THREE.MeshStandardMaterial({ color: 0x4CC3D9 });
        const cube = new THREE.Mesh(cubeGeometry, cubeMaterial);
        cube.visible = false; // Start invisible
        scene.add(cube);

        let xrHitTestSource = null;

        // Handle AR session
        renderer.xr.addEventListener('sessionstart', async () => {
            try {
                const session = renderer.xr.getSession();
                const viewerSpace = await session.requestReferenceSpace('viewer');
                xrHitTestSource = await session.requestHitTestSource({ space: viewerSpace });

                session.addEventListener('end', () => {
                    xrHitTestSource = null;
                });
            } catch (error) {
                alert(`Session start failed: ${error.message}`);
            }
        });

        // Render loop
        renderer.setAnimationLoop((timestamp, frame) => {
            if (frame && xrHitTestSource) {
                try {
                    const referenceSpace = renderer.xr.getReferenceSpace();
                    const hitTestResults = frame.getHitTestResults(xrHitTestSource);

                    if (hitTestResults.length > 0) {
                        const hit = hitTestResults[0];
                        const pose = hit.getPose(referenceSpace);

                        // Place the cube at the detected hit position
                        cube.visible = true;
                        cube.position.set(
                            pose.transform.position.x,
                            pose.transform.position.y,
                            pose.transform.position.z
                        );
                    }
                } catch (error) {
                    alert(`Hit test error: ${error.message}`);
                }
            }

            renderer.render(scene, camera);
        });
    </script>
</body>
</html>
